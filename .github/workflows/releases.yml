name: Build and Publish Releases

on:
  push:
    tags:
      - 'v*'

jobs:
  # ------------------------------------------------------------------
  # 1. СБОРКА ПОД WINDOWS (GUI & CLI)
  # ------------------------------------------------------------------
  build-windows:
    name: Build Windows Executables
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Executables
        run: |
          pyinstaller --noconfirm --onedir --windowed --name CertScanner-GUI get_cert_info_gui.py
          pyinstaller --noconfirm --onefile --name certscanner-cli get_cert_info.py

      - name: Compress Archives
        run: |
          Compress-Archive -Path "dist/CertScanner-GUI/*" -DestinationPath "CertScanner-Windows-GUI-x64.zip"
          Compress-Archive -Path "dist/certscanner-cli.exe" -DestinationPath "CertScanner-Windows-CLI-x64.zip"

      - name: Upload Windows Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CertScanner-Windows-GUI-x64.zip
            CertScanner-Windows-CLI-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------
  # 2. СБОРКА ПОД LINUX (DEB, RPM, APPIMAGE, TAR.GZ)
  # ------------------------------------------------------------------
  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm wget libfuse2

      - name: Install Dependencies & Build PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --onedir --windowed --name certscanner-gui get_cert_info_gui.py
          pyinstaller --noconfirm --onefile --name certscanner-cli get_cert_info.py

      # --- 1. Автономные TAR.GZ архивы ---
      - name: Compress Linux Executables
        run: |
          tar -czvf "CertScanner-Linux-GUI-x64.tar.gz" -C dist certscanner-gui
          tar -czvf "CertScanner-Linux-CLI-x64.tar.gz" -C dist certscanner-cli

      # --- 2. DEB пакет (нативно через dpkg-deb) ---
      - name: Build DEB Package
        run: |
          RAW_VER="${GITHUB_REF_NAME}"
          VERSION="${RAW_VER#[vV]}"
          DEB_DIR="certscanner_${VERSION}_amd64"

          mkdir -p "${DEB_DIR}/DEBIAN"
          mkdir -p "${DEB_DIR}/usr/lib/certscanner"
          mkdir -p "${DEB_DIR}/usr/bin"
          mkdir -p "${DEB_DIR}/usr/share/applications"
          mkdir -p "${DEB_DIR}/usr/share/icons/hicolor/256x256/apps"

          cp -r dist/certscanner-gui/* "${DEB_DIR}/usr/lib/certscanner/"
          cp dist/certscanner-cli "${DEB_DIR}/usr/bin/certscanner-cli"
          cp packaging/certscanner.desktop "${DEB_DIR}/usr/share/applications/"
          cp packaging/certscanner.png "${DEB_DIR}/usr/share/icons/hicolor/256x256/apps/"

          cat << 'EOF' > "${DEB_DIR}/usr/bin/certscanner-gui"
          #!/bin/sh
          exec /usr/lib/certscanner/certscanner-gui "$@"
          EOF
          chmod +x "${DEB_DIR}/usr/bin/certscanner-gui"

          cat << EOF > "${DEB_DIR}/DEBIAN/control"
          Package: certscanner
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Developer <developer@example.com>
          Description: X.509 Certificate Scanner and Exporter (GUI & CLI)
          EOF

          dpkg-deb --build "${DEB_DIR}"

      # --- 3. RPM пакет (нативно через rpmbuild) ---
      - name: Build RPM Package
        run: |
          RAW_VER="${GITHUB_REF_NAME}"
          VERSION="${RAW_VER#[vV]}"

          RPM_ROOT="${HOME}/rpmbuild"
          BUILD_ROOT="${RPM_ROOT}/BUILDROOT/certscanner-${VERSION}-1.x86_64"

          mkdir -p "${RPM_ROOT}/SPECS"
          mkdir -p "${RPM_ROOT}/RPMS"
          mkdir -p "${BUILD_ROOT}/usr/lib/certscanner"
          mkdir -p "${BUILD_ROOT}/usr/bin"
          mkdir -p "${BUILD_ROOT}/usr/share/applications"
          mkdir -p "${BUILD_ROOT}/usr/share/icons/hicolor/256x256/apps"

          cp -r dist/certscanner-gui/* "${BUILD_ROOT}/usr/lib/certscanner/"
          cp dist/certscanner-cli "${BUILD_ROOT}/usr/bin/certscanner-cli"
          cp packaging/certscanner.desktop "${BUILD_ROOT}/usr/share/applications/"
          cp packaging/certscanner.png "${BUILD_ROOT}/usr/share/icons/hicolor/256x256/apps/"

          cat << 'EOF' > "${BUILD_ROOT}/usr/bin/certscanner-gui"
          #!/bin/sh
          exec /usr/lib/certscanner/certscanner-gui "$@"
          EOF
          chmod +x "${BUILD_ROOT}/usr/bin/certscanner-gui"

          cat << EOF > "${RPM_ROOT}/SPECS/certscanner.spec"
          Name:           certscanner
          Version:        ${VERSION}
          Release:        1
          Summary:        X.509 Certificate Scanner and Exporter
          License:        GPLv3
          Architecture:   x86_64

          %description
          X.509 Certificate Scanner and Exporter (GUI & CLI)

          %files
          /usr/lib/certscanner
          /usr/bin/certscanner-gui
          /usr/bin/certscanner-cli
          /usr/share/applications/certscanner.desktop
          /usr/share/icons/hicolor/256x256/apps/certscanner.png
          EOF

          rpmbuild -bb --buildroot="${BUILD_ROOT}" "${RPM_ROOT}/SPECS/certscanner.spec"
          cp ${RPM_ROOT}/RPMS/x86_64/*.rpm ./

      # --- 4. AppImage (официальный appimagetool) ---
      - name: Build AppImage
        run: |
          RAW_VER="${GITHUB_REF_NAME}"
          VERSION="${RAW_VER#[vV]}"

          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          mkdir -p AppDir/usr/lib/certscanner
          mkdir -p AppDir/usr/bin

          cp -r dist/certscanner-gui/* AppDir/usr/lib/certscanner/
          cp packaging/certscanner.desktop AppDir/
          cp packaging/certscanner.png AppDir/

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/lib/certscanner/certscanner-gui" "$@"
          EOF
          chmod +x AppDir/AppRun

          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir "CertScanner-${VERSION}-x86_64.AppImage"

      # --- Загрузка всех собранных файлов в Release ---
      - name: Upload Linux Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            certscanner_*.deb
            certscanner-*.rpm
            CertScanner-*-x86_64.AppImage
            CertScanner-Linux-GUI-x64.tar.gz
            CertScanner-Linux-CLI-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
