name: Build and Publish Releases

on:
  push:
    tags:
      - 'v*'

jobs:
  # ------------------------------------------------------------------
  # 1. СБОРКА ПОД WINDOWS (GUI & CLI)
  # ------------------------------------------------------------------
  build-windows:
    name: Build Windows Executables
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Executables with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name CertScanner-GUI get_cert_info_gui.py
          pyinstaller --noconfirm --onefile --name certscanner-cli get_cert_info.py

      - name: Compress Executables into ZIP Archives
        run: |
          Compress-Archive -Path "dist/CertScanner-GUI/*" -DestinationPath "CertScanner-Windows-GUI-x64.zip"
          Compress-Archive -Path "dist/certscanner-cli.exe" -DestinationPath "CertScanner-Windows-CLI-x64.zip"

      - name: Upload Windows Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CertScanner-Windows-GUI-x64.zip
            CertScanner-Windows-CLI-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------
  # 2. СБОРКА ПОД LINUX (DEB, RPM, APPIMAGE - GUI & CLI)
  # ------------------------------------------------------------------
  build-linux:
    name: Build Linux Packages (DEB, RPM, AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Packaging Tools & FPM
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-dev rubygems build-essential wget fuse libfuse2 rpm
          sudo gem install --no-document fpm

      - name: Install Python Dependencies & Build PyInstaller Binary
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --onedir --windowed --name certscanner-gui get_cert_info_gui.py
          pyinstaller --noconfirm --onefile --name certscanner-cli get_cert_info.py

      - name: Compress Linux CLI Executable
        run: |
          tar -czvf "CertScanner-Linux-CLI-x64.tar.gz" -C dist certscanner-cli

      - name: Prepare Linux Package Directory Structures
        run: |
          # 1. Структура для полного пакета (GUI + CLI)
          mkdir -p pkg_root/usr/bin
          mkdir -p pkg_root/usr/share/applications
          mkdir -p pkg_root/usr/share/icons/hicolor/256x256/apps
          mkdir -p pkg_root/usr/lib/certscanner

          cp -r dist/certscanner-gui/* pkg_root/usr/lib/certscanner/
          cp dist/certscanner-cli pkg_root/usr/bin/certscanner-cli

          cat << 'EOF' > pkg_root/usr/bin/certscanner-gui
          #!/bin/sh
          exec /usr/lib/certscanner/certscanner-gui "$@"
          EOF
          chmod +x pkg_root/usr/bin/certscanner-gui

          if [ -f packaging/certscanner.desktop ]; then
            cp packaging/certscanner.desktop pkg_root/usr/share/applications/
          fi
          if [ -f packaging/certscanner.png ]; then
            cp packaging/certscanner.png pkg_root/usr/share/icons/hicolor/256x256/apps/
          fi

          # 2. Структура для отдельного пакета CLI (только бинарник)
          mkdir -p cli_pkg_root/usr/bin
          cp dist/certscanner-cli cli_pkg_root/usr/bin/certscanner-cli

      - name: Build DEB Packages
        run: |
          RAW_VER="${GITHUB_REF_NAME}"
          VERSION="${RAW_VER#[vV]}"

          # DEB: Полный пакет (GUI + CLI)
          fpm -s dir -t deb \
            -n certscanner \
            -v "${VERSION}" \
            -C pkg_root \
            --description "X.509 Certificate Scanner and Exporter (GUI & CLI)" \
            --license "GPLv3" \
            .

          # DEB: Легкий пакет (только CLI)
          fpm -s dir -t deb \
            -n certscanner-cli \
            -v "${VERSION}" \
            -C cli_pkg_root \
            --description "X.509 Certificate Scanner (CLI only)" \
            --license "GPLv3" \
            .

      - name: Build RPM Packages
        run: |
          RAW_VER="${GITHUB_REF_NAME}"
          VERSION="${RAW_VER#[vV]}"

          # RPM: Полный пакет (GUI + CLI)
          fpm -s dir -t rpm \
            -n certscanner \
            -v "${VERSION}" \
            --iteration 1 \
            -C pkg_root \
            --description "X.509 Certificate Scanner and Exporter (GUI & CLI)" \
            --license "GPLv3" \
            .

          # RPM: Легкий пакет (только CLI)
          fpm -s dir -t rpm \
            -n certscanner-cli \
            -v "${VERSION}" \
            --iteration 1 \
            -C cli_pkg_root \
            --description "X.509 Certificate Scanner (CLI only)" \
            --license "GPLv3" \
            .

      - name: Build AppImage
        run: |
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract

          mkdir -p AppDir
          cp -r pkg_root/* AppDir/

          if [ -f packaging/certscanner.desktop ]; then cp packaging/certscanner.desktop AppDir/; fi
          if [ -f packaging/certscanner.png ]; then cp packaging/certscanner.png AppDir/certscanner.png; fi

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/lib/certscanner/certscanner-gui" "$@"
          EOF
          chmod +x AppDir/AppRun

          ARCH=x86_64 ./squashfs-root/AppRun AppDir "CertScanner-${GITHUB_REF_NAME}-x86_64.AppImage"

      - name: Upload Linux Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
            *.rpm
            CertScanner-*.AppImage
            CertScanner-Linux-CLI-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------
  # 3. СБОРКА FLATPAK
  # ------------------------------------------------------------------
  build-flatpak:
    name: Build Flatpak Package
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flatpak/flatpak-github-actions/ubuntu:manifest-v1
      options: --privileged
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Flatpak Bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: CertScanner.flatpak
          manifest-path: packaging/org.example.CertScanner.yml
          repository-name: certscanner-repo
          branch: main

      - name: Upload Flatpak Bundle to Release
        uses: softprops/action-gh-release@v2
        with:
          files: CertScanner.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
